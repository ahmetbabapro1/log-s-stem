<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Benim Log Panelim</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin-top: 50px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #00ff88; }
        .btn { background: #00ff88; color: black; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .status-dot { height: 10px; width: 10px; background-color: #00ff88; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sistem Çevrimiçi</h1>
        <p><span class="status-dot"></span> Loglar aktif olarak izleniyor.</p>
        <br>
        <a href="#" class="btn">Logları Görüntüle</a>
    </div>
</body>
</html>
